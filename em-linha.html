<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS em linha</title>
    <style>
       em{
       color: orange;
        text-decoration: underline;
       }
        code {color:lime;
        text-decoration: underline;
        }
        body > main > ol > li:nth-child(1) > code {
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>Dcc202 CSS em Linha</h1>
        <P>o estilo <em> em linha </em> é aplicado diretamente no elemento via atributo 
            <code>style</code>.</P>
            <ol>
            <li><code>hello Word!</code></li>
            <li><code>2+2=4</code></li>
            </ol>
    </main>
</body>
</html>
